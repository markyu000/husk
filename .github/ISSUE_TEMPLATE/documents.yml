name: "📝 Documents"
description: 文档新增、修正或补充
title: "[Docs] "
labels: ["type/docs"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: 所属范围
      description: 对应 scope/* label，提交后请维护者手动补加
      options:
        - learning-engine
        - reviewing-engine
        - ui
        - word-card
        - route-rule-table
        - 其他
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: 文档描述
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
    validations:
      required: false
