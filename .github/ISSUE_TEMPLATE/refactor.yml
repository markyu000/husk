name: "♻️ Refactor"
description: 代码重构、结构优化
title: "[Refactor] "
labels: ["type/refact"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: 所属范围
      description: 对应 scope/* label，提交后请维护者手动补加
      options:
        - learning-engine
        - reviewing-engine
        - ui
        - word-card
        - route-rule-table
        - 其他
    validations:
      required: false

  - type: textarea
    id: target
    attributes:
      label: 操作部分
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 目标
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: 实现方式
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
    validations:
      required: false
